[project]
name = "data-factory"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["pandas", "SQLAlchemy", "psycopg2-binary", "nyc311-factory>=0.2.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
data_factory = ["sql/*.sql", "sql/queries/*.sql"]
